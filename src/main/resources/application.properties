spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME:project-management-backend}

# ============================================================
# SERVER
# ============================================================
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
# Each SSE/chat connection holds a Tomcat worker thread for the life of the
# connection (up to 30 min). Default max (200) gets eaten up fast by long-lived
# streams, starving normal API requests. Raise it and bound idle connections.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}

# ============================================================
# DATABASE - POSTGRESQL
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pmt}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:}
# Default Hikari pool (10) is too small once concurrent users grow; requests
# queue for a connection and everything slows down together. Size this to
# your DB's actual capacity, not arbitrarily high.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:30000}

spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
# Local development compatibility for an already-applied migration whose checksum changed.
# Production profile explicitly enables validation.
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}

# ============================================================
# FILE UPLOADS
# ============================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ============================================================
# JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=${JACKSON_WRITE_DATES_AS_TIMESTAMPS:false}

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:project-management-api}

# ============================================================
# AUTHENTICATION
# ============================================================
auth.refresh-expiration-days=${AUTH_REFRESH_EXPIRATION_DAYS:7}
auth.password-reset-expiration-minutes=${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:10}
auth.email-verification-expiration-hours=${AUTH_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}

# ============================================================
# CORS / FRONTEND
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}
app.name=${APP_NAME:Project Management}

# ============================================================
# EMAIL
# ============================================================
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@projectmanagement.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ============================================================
# WEB PUSH
# ============================================================
app.notification.web-push.enabled=${APP_NOTIFICATION_WEB_PUSH_ENABLED:false}
app.notification.web-push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.notification.web-push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.notification.web-push.vapid-subject=${VAPID_SUBJECT:mailto:admin@projectmanagement.local}

# ============================================================
# SECURITY
# ============================================================
app.security.trust-forwarded-headers=${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}

# ============================================================
# SCHEDULERS
# ============================================================
app.scheduler.reminder.fixed-delay-ms=${REMINDER_SCHEDULER_DELAY_MS:60000}
app.scheduler.overdue-ticket.fixed-delay-ms=${OVERDUE_TICKET_SCHEDULER_DELAY_MS:300000}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}

# Production-safe authentication controls
auth.signup.enabled=${AUTH_SIGNUP_ENABLED:false}

# Public authentication-adjacent endpoint throttling
auth.public.max-attempts=${AUTH_PUBLIC_MAX_ATTEMPTS:5}
auth.public.window-minutes=${AUTH_PUBLIC_WINDOW_MINUTES:15}

# ============================================================
# FIREBASE CLOUD MESSAGING (FCM)
# ============================================================
# FCM is disabled until Firebase credentials are configured.
app.notification.fcm.enabled=${APP_NOTIFICATION_FCM_ENABLED:false}
# Optional path to Firebase service-account JSON.
# If empty, Google Application Default Credentials are used.
app.notification.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}
